plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = 'dev.pieter.simulated_pistons'

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

sourceSets {
    simulatedApiStubs {
        compileClasspath += sourceSets.main.compileClasspath
    }
    main {
        compileClasspath += simulatedApiStubs.output
        resources.srcDir 'src/generated/resources'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://mvn.devos.one/snapshots" }
    maven { url = "https://maven.ryanhcode.dev/releases" }
    maven { url = "https://maven.ryanhcode.dev/private" }
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    implementation("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        exclude group: "foundry.veil"
        exclude group: "com.tterrag.registrate"
    }

    // Simulated and Aeronautics are declared as required runtime mods in mods.toml.
    // Tiny compile-only stubs for Simulated's ExtraKinetics API live in
    // src/simulatedApiStubs and are intentionally not packaged into the jar.
}

def pistonModelManifest = layout.projectDirectory.file('src/main/resources/assets/simulated_pistons/models/block/simulated_piston/model_parts.json')
def pistonModelRoot = layout.projectDirectory.dir('src/main/resources/assets/simulated_pistons/models/block/simulated_piston')
def generatedResourcesRoot = layout.projectDirectory.dir('src/generated/resources')

def renderPistonModels = { File outputRoot ->
    def json = new groovy.json.JsonSlurper()
    def manifest = json.parse(pistonModelManifest.asFile)
    def outputs = new LinkedHashMap()

    manifest.outputs.each { outputName, output ->
        def merged = new LinkedHashMap()
        merged.format_version = output.format_version ?: '1.21.11'
        merged.credit = manifest.generated_credit
        merged.parent = output.parent ?: 'minecraft:block/block'
        if (output.texture_size != null) {
            merged.texture_size = output.texture_size
        }

        def textures = new LinkedHashMap()
        def elements = []
        def groups = []

        output.parts.each { partPath ->
            def partFile = pistonModelRoot.file("${partPath}.json").asFile
            if (!partFile.isFile()) {
                throw new GradleException("Missing piston model source part '${partPath}' for '${outputName}'")
            }

            def part = json.parse(partFile)
            part.textures?.each { key, value ->
                if (textures.containsKey(key) && textures[key] != value) {
                    throw new GradleException("Texture key '${key}' differs while generating '${outputName}' from '${partPath}'")
                }
                textures[key] = value
            }

            def elementOffset = elements.size()
            part.elements?.each { element ->
                elements.add(element)
            }

            part.groups?.each { group ->
                groups.add(offsetGroupChildren(group, elementOffset))
            }
        }

        if (!textures.isEmpty()) {
            merged.textures = textures
        }
        merged.elements = elements
        if (!groups.isEmpty()) {
            merged.groups = groups
        }
        if (output.display_from != null) {
            def displayFile = pistonModelRoot.file("${output.display_from}.json").asFile
            if (!displayFile.isFile()) {
                throw new GradleException("Missing piston model display source '${output.display_from}' for '${outputName}'")
            }

            def displaySource = json.parse(displayFile)
            if (displaySource.display == null) {
                throw new GradleException("Piston model display source '${output.display_from}' has no display block")
            }
            merged.display = displaySource.display
        }

        def projectOutputFile = layout.projectDirectory.file(output.path).asFile
        def relativeOutputPath = generatedResourcesRoot.asFile.toPath().relativize(projectOutputFile.toPath()).toString()
        def rendered = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged)) + System.lineSeparator()
        outputs[relativeOutputPath] = rendered

        def outputFile = new File(outputRoot, relativeOutputPath)
        outputFile.parentFile.mkdirs()
        outputFile.text = rendered
    }

    return outputs
}

tasks.register('generatePistonModels') {
    def generatedRoot = generatedResourcesRoot

    inputs.file(pistonModelManifest)
    inputs.dir(pistonModelRoot.dir('source_parts'))
    outputs.dir(generatedRoot)

    doLast {
        renderPistonModels(generatedRoot.asFile)
    }
}

tasks.register('verifyPistonModels') {
    def generatedRoot = generatedResourcesRoot
    def verifyRoot = layout.buildDirectory.dir('tmp/verifyPistonModels')

    inputs.file(pistonModelManifest)
    inputs.dir(pistonModelRoot.dir('source_parts'))
    inputs.dir(generatedRoot)
    outputs.upToDateWhen { false }
    mustRunAfter tasks.named('generatePistonModels')

    doLast {
        def verifyDir = verifyRoot.get().asFile
        delete verifyDir
        def renderedOutputs = renderPistonModels(verifyDir)
        def mismatches = []

        renderedOutputs.each { relativePath, rendered ->
            def generatedFile = new File(generatedRoot.asFile, relativePath)
            if (!generatedFile.isFile()) {
                mismatches.add("${relativePath} is missing")
                return
            }

            def current = generatedFile.getText('UTF-8')
            if (current.replace('\r\n', '\n') != rendered.replace('\r\n', '\n')) {
                mismatches.add("${relativePath} is stale")
            }
        }

        if (!mismatches.isEmpty()) {
            throw new GradleException("Generated piston models are out of date:\n - " + mismatches.join('\n - ') + "\nRun './gradlew.bat generatePistonModels'.")
        }
    }
}

static def offsetGroupChildren(def group, int elementOffset) {
    if (group instanceof Number) {
        return group + elementOffset
    }
    if (group instanceof Map) {
        def adjusted = new LinkedHashMap(group)
        if (adjusted.children instanceof List) {
            adjusted.children = adjusted.children.collect { child -> offsetGroupChildren(child, elementOffset) }
        }
        return adjusted
    }
    return group
}

tasks.withType(ProcessResources).configureEach {
    dependsOn tasks.named('generatePistonModels')

    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
            neoforge_version: neoforge_version,
            create_mod_version: create_mod_version,
            sable_mod_version: sable_mod_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_author: mod_author,
            license: license,
            description: description
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyPistonModels')
}
